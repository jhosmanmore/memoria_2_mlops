# Configuración central del proyecto (Actividad 2).
# Parámetros desacoplados del código fuente: datos, modelo, evaluación champion,
# MLflow, inferencia por lotes, API y despliegues en Prefect.

datos:
  ruta: data/car_sales_dataset.csv
  num_registros: 20000
  semilla: 42
  columnas_esperadas:
    - fecha_venta
    - marca
    - tipo_vehiculo
    - año_modelo
    - kilometraje
    - precio_lista
    - precio_venta

modelo:
  objetivo: precio_venta
  tipo: random_forest                # random_forest | linear_regression
  hiperparametros:
    n_estimators: 220
    max_depth: 11
    random_state: 42
  test_size: 0.2
  semilla_split: 42

evaluacion:
  metrica_champion: r2               # Métrica de negocio principal (r2 | rmse | mae)
  umbral_minimo: 0.85                # Umbral mínimo requerido para ser candidato a champion
  mejora_minima: 0.00001             # Margen de mejora requerido
  modo: max

mlflow:
  experimento: precio-vehiculos
  nombre_modelo: precio-vehiculos-model
  alias_champion: champion
  nombre_run: rf-tuning-v4-nuevo-champion

inferencia:
  tamano_lote: 50                    # Filas simuladas para el lote diario
  ruta_salida: data/predicciones     # Carpeta donde se guardan las predicciones
  prefijo_archivo: predicciones      # Prefijo para el archivo con fecha: predicciones_YYYYMMDD_HHMMSS.csv

api:
  host: 0.0.0.0
  port: 8000
  titulo: API de Inferencia - Precio de Vehículos Usados
  version: 0.2.0

despliegues:
  cron_inferencia: "0 2 * * *"       # Ejecución diaria a las 02:00 AM
  nombre_entrenamiento: entrenamiento-despliegue
  nombre_inferencia: inferencia-diaria-despliegue
